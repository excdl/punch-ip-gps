<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body {font-family:"Arial","Noto Sans TC",sans-serif;background:#f0f4f8;display:flex;justify-content:center;padding:20px;margin:0;}
.card {background:#fff;width:95%;max-width:480px;border-radius:20px;padding:25px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 15px 30px rgba(0,0,0,0.15);}
#userInfo {font-size:28px;font-weight:bold;text-align:center;color:#2c3e50;}
#dateTime {font-size:22px;color:#7f8c8d;text-align:center;}
#statusInfo {font-size:20px;color:white;padding:8px 25px;border-radius:25px;text-align:center;min-width:180px;}
.buttons-container {display:flex;gap:15px;width:100%;}
.buttons-container button {flex:1;padding:15px 0;font-size:22px;font-weight:bold;border-radius:12px;border:none;cursor:pointer;color:white;transition:all 0.2s;}

/* 🚀 優化點：更改按鈕顏色（上班：橘色 / 下班：藍色） */
#btnStart {background: linear-gradient(135deg, #ff9f43, #ee5253);}
#btnEnd {background: linear-gradient(135deg, #3498db, #2980b9);}

button:disabled {opacity:0.5;cursor:not-allowed;}
#todayRecords {width:100%;background:#fafafa;border-radius:14px;padding:15px;border:1px solid #ddd;font-size:18px;text-align:left;}
#todayRecords span {display:block;margin-bottom:5px;padding-left:5px;border-left:3px solid #3498db;}

/* 主管審批按鈕 */
#btnApprove {
    margin-top:10px;
    padding:12px 20px;
    font-size:18px;
    font-weight:bold;
    border-radius:10px;
    background:linear-gradient(145deg,#8e44ad,#663399);
    color:white;
    display:none;
    width:100%;
    cursor:pointer;
    border:none;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
</style>
</head>
<body>
<div class="card">
  <div id="userInfo">載入使用者資訊中...</div>
  <div id="statusInfo">定位確認中…</div>
  <div id="dateTime">載入中…</div>
  <div class="buttons-container">
    <button id="btnStart" disabled>定位中…</button>
    <button id="btnEnd" disabled>定位中…</button>
  </div>
  <div id="todayRecords">今日打卡紀錄（點擊更新）</div>
  <button id="btnApprove">查看 | 簽核</button>
</div>
 

<script>
const API_ENDPOINT="https://script.google.com/macros/s/AKfycby43oYhfa-HTUwEMKg74ws-xtnPHrIglL8cRot_xyu0YlJeEIaW36Z9PSKywtRL7APj7A/exec";

let userId="", userName="", dataReady=false;
let statusLoaded=false;
let MANAGERS = [];
let isManager = false;

/* ===== GPS 即時系統 ===== */
let lastGPS = null;
let gpsAccuracy = null;
let cachedIP = "";
let lastRangeStatus = null;

const btnStart=document.getElementById("btnStart");
const btnEnd=document.getElementById("btnEnd");
const userInfo=document.getElementById("userInfo");
const statusInfo=document.getElementById("statusInfo");
const dateTime=document.getElementById("dateTime");
const todayRecords=document.getElementById("todayRecords");

/* ===== 讀取主管 ===== */
async function loadManagers(){
  try{
    const res = await fetch(`${API_ENDPOINT}?action=getManagers`);
    MANAGERS = await res.json();
    isManager = MANAGERS.includes(userId);
    if (isManager) {
      document.getElementById("btnApprove").style.display = "block";
    }
  }catch(err){
    console.error("讀取主管失敗", err);
    MANAGERS = [];
  }
}

/* ===== 日期 ===== */
function getTodayString(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}

/* ===== 按鈕狀態還原與文字鎖定 ===== */
function setButtonsLock(lock, textStart = "上班", textEnd = "下班"){
  btnStart.disabled = lock;
  btnEnd.disabled = lock;
  btnStart.textContent = textStart;
  btnEnd.textContent = textEnd;
}

/* ===== 時間 ===== */
function updateDateTime(){
  const now=new Date();
  dateTime.textContent=now.toLocaleString("zh-TW",{hour12:false});
}
setInterval(updateDateTime,1000);
updateDateTime();

/* ===== IP ===== */
async function preloadIP(){
  try{
    const res=await fetch("https://api.ipify.org?format=json");
    const data=await res.json();
    cachedIP = data.ip;
  }catch(err){
    console.warn("IP 讀取失敗:", err);
  }
}
function getIP(){
  return cachedIP || "";
}

/* ===== GPS ===== */
function initGPSWatcher(){
  if(!navigator.geolocation) return;

  navigator.geolocation.watchPosition(
    pos=>{
      const isFirstLocation = (lastGPS === null); 
      gpsAccuracy = pos.coords.accuracy;
      lastGPS = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      };
      
      updateStatus(isFirstLocation); 
    },
    err=>console.warn("GPS錯誤:",err),
    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:5000
    }
  );
}

/* ===== LIFF ===== */
async function initUser(){
  await liff.init({ liffId: "2010795326-ID1oydWL" });

  if (!liff.isLoggedIn()) {
    await liff.login();
  }

  const profile = await liff.getProfile();
  userId = profile.userId;
  userName = profile.displayName;

  userInfo.textContent = `${userName} 您好`;
}

/* ===== 狀態 (改為支援僅靠 IP 快速判斷，不強制等待 lastGPS) ===== */
async function updateStatus(forceRefresh = false) {
  // 如果連 IP 都還沒抓到，才顯示初始化提示
  if (!cachedIP && !lastGPS) {
    statusInfo.textContent = "網路與定位初始化中…";
    statusInfo.style.background = "#95a5a6";
    setButtonsLock(true, "載入中...", "載入中...");
    statusLoaded = false;
    return;
  }

  try {
    const lat = lastGPS ? lastGPS.lat : "";
    const lng = lastGPS ? lastGPS.lng : "";
    
    const res = await fetch(
      `${API_ENDPOINT}?action=check&lat=${lat}&lng=${lng}&ip=${encodeURIComponent(getIP())}`
    );

    const data = await res.json();
    const newStatus = data.rangeStatus;
    if (!newStatus) return;

    if (!forceRefresh && newStatus === lastRangeStatus) return;
    lastRangeStatus = newStatus;

    if (newStatus === "有效打卡區") {
      statusInfo.style.background = "#2ecc71";
      statusInfo.textContent = "有效打卡區";
      setButtonsLock(false, "上班", "下班");
    } else {
      statusInfo.style.background = "#e74c3c";
      const distText = data.distance ? ` (${data.distance} 公尺)` : "";
      statusInfo.textContent = "無效打卡區" + distText;

      if (isManager) {
        setButtonsLock(false, "上班 (主管)", "下班 (主管)");
      } else {
        setButtonsLock(true, "上班", "下班");
      }
    }

    statusLoaded = true;

  } catch (err) {
    console.warn("狀態更新失敗:", err);
  }
}

/* ===== 今日紀錄（已優化效能） ===== */
async function updateTodayRecords(){
  todayRecords.innerHTML="載入中...";
  try{
    const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${userId}&date=${getTodayString()}`);
    const data = await res.json();

    if(!data.length){
      todayRecords.innerHTML="今日打卡紀錄：無";
      return;
    }

    let htmlContent = "今日打卡紀錄：<br>";
    const recordsHTML = data.map(r => {
      let color = "#3498db";
      if(r.status === "下班") color = "#2ecc71";
      if(r.company.includes("錯誤")) color = "#e67e22";
      return `<span style="border-left-color:${color}">${r.status}：${r.time}（${r.company}）</span>`;
    }).join("");

    todayRecords.innerHTML = htmlContent + recordsHTML;
  }catch{
    todayRecords.innerHTML="今日打卡紀錄：讀取失敗";
  }
}

/* ===== LINE 訊息 ===== */
async function sendSelfMessage(record){
  if(!liff.isInClient()) return;

  let headerColor = "#3498db"; 
  if(record.status === "下班") headerColor = "#2ecc71"; 
  if(record.rangeStatus !== "有效打卡區") headerColor = "#e67e22"; 

  let reasonText = record.rangeStatus !== "有效打卡區" ? "異常原因：超出打卡區" : "";

  try{
    await liff.sendMessages([{
      type:'flex',
      altText:'打卡通知',
      contents:{
        type:"bubble",
        header:{
          type:"box",
          layout:"vertical",
          contents:[{
            type:"text",
            text:`${record.userName} 已打卡`,
            weight:"bold",
            size:"lg",
            color:"#ffffff"
          }],
          backgroundColor: headerColor,
          paddingAll:"12px"
        },
        body:{
          type:"box",
          layout:"vertical",
          spacing:"md",
          contents:[
            {type:"text", text:`狀態：${record.status}`},
            {type:"text", text:`時間：${record.date} ${record.time}`},
            {type:"text", text:`位置：${record.company}`},
            ...(reasonText ? [{type:"text", text: reasonText, color:"#e67e22"}] : [])
          ]
        }
      }
    }]);
    await new Promise(r => setTimeout(r, 800));
    console.log("訊息已送出");
  }catch(err){
    console.error("LIFF 訊息傳送失敗:", err);
  }
}

/* ===== 打卡 (修正體驗版本) ===== */
async function clockInOut(status) {
  if (!dataReady || !statusLoaded) {
    Swal.fire({
      icon: "info",
      title: "資料讀取中或定位中",
      timer: 1500,
      showConfirmButton: false
    });
    return;
  }

  // 權限檢查
  if (lastRangeStatus !== "有效打卡區" && !isManager) {
    Swal.fire({
      icon: "warning",
      title: "目前為無效打卡區",
      text: "僅主管可打卡",
      timer: 1500,
      showConfirmButton: false
    });
    return;
  }

  const btn = status === "上班" ? btnStart : btnEnd;
  const originalText = btn.textContent;

  // [關鍵修改點 1]：初始化動畫狀態
  let sec = 3;
  btn.textContent = `打卡中… ${sec}s`;
  btn.disabled = true; // 鎖定按鈕

  // 定義倒數計時器實體，稍後需要清除它
  const timerInterval = setInterval(() => {
    sec--;
    if (sec > 0) {
      btn.textContent = `打卡中… ${sec}s`;
    } else {
      // 當倒數到 1 時，顯示最後狀態，文字不再跳動
      btn.textContent = `打卡處理中…`;
      clearInterval(timerInterval); // 停止動畫
    }
  }, 1000);

  try {
    // 發送打卡請求
    const res = await fetch(API_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({
        userId,
        userName,
        ip: getIP(),
        gps: lastGPS || {
          lat: "",
          lng: ""
        },
        status
      })
    });

    const data = await res.json();
    console.log("後台回傳結果：", data);

    // [關鍵修改點 2]：確保倒數動畫最少跑 3 秒，若網路太快則延遲顯示彈窗
    const minWaitTime = 3000; // 確保總等待時間至少為 3 秒 (秒數*1000)
    const elapsedTime = (3 - sec) * 1000; // 計算從點擊到現在已經過的時間 (不準確，但簡單估算)
    // 更好的做法是記錄開始時間，這裡用簡單的時間差計算
    const startTime = new Date().getTime();
    
    // [這裡是嚴謹的做法，確保至少跑完動畫]
    // 為了讓使用者感覺動畫有跑完，我們等待剩下的時間，或者直接彈窗
    // 建議簡化寫法如下，讓動畫跑完最後 1 秒文字
    
    if (sec > 0) {
      // 如果倒數還沒結束，為了體驗，我們讓它跑完最後一秒
      await new Promise(r => setTimeout(r, sec * 1000 + 500)); // 多加 0.5秒緩衝
    } else {
      // 如果倒數已經結束（顯示打卡處理中），我們稍微延遲一下讓 UI 反應
      await new Promise(r => setTimeout(r, 500)); 
    }

    // 檢查後台回傳訊息並彈窗
    if (data && data.message) {
      if (data.message.includes("錯誤") || data.message.includes("上限") || data.message.includes("未更新")) {
        await Swal.fire({
          icon: "warning",
          title: data.message,
          timer: 2000,
          showConfirmButton: false
        });
      } else {
        if (data.rangeStatus === "有效打卡區") {
          await Swal.fire({
            icon: "success",
            title: "打卡成功",
            timer: 2000,
            showConfirmButton: false
          });
        } else {
          await Swal.fire({
            icon: "warning",
            title: "打卡完成（不在有效打卡區）",
            timer: 2000,
            showConfirmButton: false
          });
        }

        // 建立紀錄並發送 LIFF 訊息
        const record = {
          userName,
          status: data.status || status,
          date: data.date,
          time: data.time,
          company: data.company || "未知",
          rangeStatus: data.rangeStatus
        };
        sendSelfMessage(record);
      }
      // 更新今日打卡清單
      updateTodayRecords();
    } else {
      await Swal.fire({
        icon: "error",
        title: "伺服器回應異常",
        timer: 2000,
        showConfirmButton: false
      });
    }

  } catch (err) {
    console.error("打卡發生錯誤：", err);
    Swal.fire({
      icon: "error",
      title: "打卡連線失敗",
      timer: 2000,
      showConfirmButton: false
    });
  } finally {
    // [關鍵修改點 3]：最後無論成功失敗，還原按鈕狀態
    if (timerInterval) clearInterval(timerInterval); // 保險清除
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

btnStart.onclick = () => clockInOut("上班");
btnEnd.onclick = () => clockInOut("下班");

document.getElementById("btnApprove").onclick = () => {
  window.location.href = "https://script.google.com/macros/s/AKfycbwe5O6ktoaMPNsbT-U8kyruMisF4pd9ezoEsW07ofMP4wKzj4veHhjsc9-cmeddUU9mgQ/exec";
};

/* ===== 載入 ===== */
window.onload = async () => {
  statusInfo.textContent = "正在檢查網路狀態...";
  statusInfo.style.background = "#95a5a6";
  setButtonsLock(true, "同步中...", "同步中...");

  // 1. 先行抓取 IP 與初始化 GPS 背景監聽
  await preloadIP();
  initGPSWatcher();

  try {
    // 2. 初始化 LIFF 使用者
    await initUser();
    dataReady = true;

    // 3. 平行讀取今日紀錄與主管權限
    await Promise.all([
      updateTodayRecords(),
      loadManagers()
    ]);
    
    // 4. [關鍵修改] 即使還沒有 GPS 座標，也先用 IP 進行第一次狀態檢查解除卡頓
    await updateStatus(true);

  } catch (error) {
    console.error("初始化失敗", error);
  }
};
</script>
</body>
</html>
