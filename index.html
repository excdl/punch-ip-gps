<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body {font-family:"Arial","Noto Sans TC",sans-serif;background:#f0f4f8;display:flex;justify-content:center;padding:20px;margin:0;}
.card {background:#fff;width:95%;max-width:480px;border-radius:20px;padding:25px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 15px 30px rgba(0,0,0,0.15);}
#userInfo {font-size:28px;font-weight:bold;text-align:center;color:#2c3e50;}
#dateTime {font-size:22px;color:#7f8c8d;text-align:center;}
#statusInfo {font-size:20px;color:white;padding:8px 25px;border-radius:25px;text-align:center;min-width:180px;}
.buttons-container {display:flex;gap:15px;width:100%;}
.buttons-container button {flex:1;padding:15px 0;font-size:22px;font-weight:bold;border-radius:12px;border:none;cursor:pointer;color:white;transition:all 0.2s;}

#btnStart {background: linear-gradient(135deg, #ff9f43, #ee5253);}
#btnEnd {background: linear-gradient(135deg, #3498db, #2980b9);}

button:disabled {opacity:0.5;cursor:not-allowed;}

/* ====== 優化後的今日打卡紀錄樣式 ====== */
#todayRecordsContainer {
    width: 100%;
    background: #fafbfc;
    border-radius: 16px;
    padding: 16px;
    border: 1px solid #e1e8ed;
    box-sizing: border-box;
}
.records-title {
    font-size: 16px;
    font-weight: bold;
    color: #34495e;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.record-item {
    background: #ffffff;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 5px solid #3498db;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    transition: transform 0.2s;
}
.record-item:last-child {
    margin-bottom: 0;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 13px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: #95a5a6;
    font-size: 15px;
    padding: 15px 0;
}

#btnApprove {
    margin-top:10px;
    padding:12px 20px;
    font-size:18px;
    font-weight:bold;
    border-radius:10px;
    background:linear-gradient(145deg,#8e44ad,#663399);
    color:white;
    display:none;
    width:100%;
    cursor:pointer;
    border:none;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* ====== SweetAlert2 自訂現代化外觀覆寫 ====== */
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
/* 倒數動畫（全螢幕置中遮罩） */
#countdownWrapper {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 255, 255, 0.85);
    z-index: 9999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#circleProgress { 
    fill: none; 
    stroke-width: 12; 
    stroke-linecap: round; 
}
#countdownText { 
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold; 
    color: #2c3e50;
    white-space: nowrap; 
}
</style>
</head>
<body>
<div class="card">
  <div id="userInfo">載入使用者資訊中...</div>
  <div id="statusInfo">網路與定位初始化中…</div>
  <div id="dateTime">載入中…</div>
  <div class="buttons-container">
    <button id="btnStart" disabled>同步中…</button>
    <button id="btnEnd" disabled>同步中…</button>
  </div>
  <!-- 圓形倒數動畫（全螢幕置中遮罩） -->
<div id="countdownWrapper">
    <svg width="120" height="120">
        <circle cx="60" cy="60" r="50" stroke="#eee" stroke-width="12" fill="none"></circle>
        <circle id="circleProgress" cx="60" cy="60" r="50" stroke="#3498db" stroke-width="12" fill="none" transform="rotate(-90 60 60)"></circle>
    </svg>
    <div id="countdownText">打卡中...</div>
</div>
  <!-- 優化後的今日紀錄容器 -->
  <div id="todayRecordsContainer">
    <div class="records-title">📋 今日打卡紀錄</div>
    <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
  </div>

  <button id="btnApprove">查看 | 簽核</button>
</div>
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbziVqRZc5dk1sui0zT2PhNXQXNlViSH0Xx8h85BMEXdE7as5wEe7IqlnG3jKAtyzXkl/exec";
const COMPANY_IPS  = ["220.134.112.245", "114.34.60.48","27.52.100.79"];
const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");

window.userReady = false;
window.allowRemote = false;

// ====== 更新日期時間 ======
function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").textContent = now.toLocaleString("zh-TW", { hour12: false });
}
setInterval(updateDateTime, 1000);
updateDateTime();


// ====== 按鈕鎖定控制 ======
function setButtonsLock(locked, startText = "上班", endText = "下班") {
    btnStart.disabled = locked;
    btnEnd.disabled = locked;
    btnStart.textContent = startText;
    btnEnd.textContent = endText;
    window.userReady = !locked;
}

// ====== 預載入與取得 IP ======
async function preloadIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) return cache;

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);
        const res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        sessionStorage.setItem("myIP", data.ip);
        return data.ip;
    } catch {
        return "";
    }
}

// ====== 本地快取讀取機制 (秒開畫面與打卡紀錄) ======
function loadUserFromCache() {
    const cachedUserId = localStorage.getItem("cached_userId");
    const cachedUserName = localStorage.getItem("cached_userName");
    const cachedPictureUrl = localStorage.getItem("cached_pictureUrl");

    if (cachedUserId) {
        window.userId = cachedUserId;
        window.userName = cachedUserName || "使用者";
        if (userInfo) userInfo.textContent = `${window.userName} 您好`;
        
        if (userAvatar) {
            if (cachedPictureUrl) {
                userAvatar.innerHTML = `<img src="${cachedPictureUrl}" alt="avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            } else {
                userAvatar.textContent = window.userName.charAt(0);
            }
        }
    }

    // 優先讀取 sessionStorage 中的打卡紀錄進行秒渲染
    const cachedRecords = sessionStorage.getItem("cached_today_records");
    if (cachedRecords) {
        try {
            renderRecords(JSON.parse(cachedRecords));
        } catch (e) {
            console.error("解析快取紀錄失敗", e);
        }
    }
}

// ====== 初始化 LIFF 使用者 ======
async function initUser() {
    await liff.init({ liffId: "2010795326-ID1oydWL" });
    if (!liff.isLoggedIn()) {
        await liff.login();
        return;
    }
    const profile = await liff.getProfile();
    window.userId = profile.userId;
    window.userName = profile.displayName;

    if (userInfo) userInfo.textContent = `${window.userName} 您好`;
    
    if (userAvatar) {
        if (profile.pictureUrl) {
            userAvatar.innerHTML = `<img src="${profile.pictureUrl}" alt="avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            localStorage.setItem("cached_pictureUrl", profile.pictureUrl);
        } else if (window.userName) {
            userAvatar.textContent = window.userName.charAt(0);
        }
    }

    localStorage.setItem("cached_userId", window.userId);
    localStorage.setItem("cached_userName", window.userName);

    const btnApprove = document.getElementById("btnApprove");
    if (btnApprove) {
        btnApprove.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
    }
}

// ====== 狀態與打卡權限判定 ======
async function updateStatus(forceRefresh = false) {
    const cachedIP = await preloadIP();
    const isCompany = COMPANY_IPS.includes(cachedIP);

    if (isCompany) {
        statusInfo.textContent = "有效打卡區";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
        window.allowRemote = false;
        return;
    }

    let remoteAllowed = false;
    if (window.userId) {
        try {
            const remoteRes = await fetch(`${API_ENDPOINT}?action=checkRemote&userId=${window.userId}`);
            const remoteData = await remoteRes.json();
            remoteAllowed = remoteData.allowed || false;
        } catch(err) {
            console.error("查詢允許異地失敗", err);
        }
    }
    window.allowRemote = remoteAllowed;

    if (remoteAllowed) {
        statusInfo.textContent = "有效打卡區(異地)";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
    } else {
        statusInfo.textContent = "無效打卡區";
        statusInfo.style.background = "#e74c3c";
        setButtonsLock(true, "上班", "下班");
    }
}

// ====== 取得手機 GPS 經緯度 ======
function getGeoLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            resolve({ lat: "", lng: "" });
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                resolve({ lat: position.coords.latitude, lng: position.coords.longitude });
            },
            () => resolve({ lat: "", lng: "" }),
            { timeout: 5000, enableHighAccuracy: true }
        );
    });
}

// ====== 時間格式處理 ======
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) return t;
    if (typeof t === "string" && t.includes("T")) return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t;
}

// ====== 初始化載入 ======
window.onload = async () => {
  statusInfo.textContent = "檢查中...";
  statusInfo.style.background = "#95a5a6";
  setButtonsLock(true, "同步中...", "同步中...");

  // 1. 優先從 LocalStorage / SessionStorage 載入畫面，達到秒開效果
  loadUserFromCache();

  try {
    // 2. 平行執行 LIFF 初始化與 IP 預載入
    await Promise.all([
      initUser(),
      preloadIP()
    ]);
    
    await updateStatus(true);
    await updateTodayRecords(false);
    await updateStatus(true);

  } catch (error) {
    console.error("初始化失敗", error);
    if (!window.userId && userInfo) {
        userInfo.textContent = "初始化失敗";
    }
    statusInfo.textContent = "重整失敗";
    statusInfo.style.background = "#e74c3c";
  }
};

/* ===== 打卡後發送 Flex Message ===== */
async function sendSelfMessage(record) {
    if (!liff.isInClient()) return;
    let headerColor = record.status === "下班" ? "#2ecc71" : "#3498db"; 
    try {
        await liff.sendMessages([{
            type: 'flex',
            altText: '打卡通知',
            contents: {
                type: "bubble",
                header: {
                    type: "box", layout: "vertical",
                    contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
                    backgroundColor: headerColor, paddingAll: "12px"
                },
                body: {
                    type: "box", layout: "vertical", spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.netType}`, size: "md" }
                    ]
                }
            }
        }]);
        await new Promise(r => setTimeout(r, 800));
    } catch(err) {
        console.error("LIFF 訊息傳送失敗:", err);
    }
}

// ===== 圓形漸層動畫打卡函式 =====
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (!window.userReady && !isMakeup) {
        Swal.fire({ 
            icon: "warning", 
            title: "提示", 
            html: "<span style='color: #e67e22;'>目前為無效打卡區，無法打卡！</span>", 
            timer: 1800, 
            showConfirmButton: false,
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    const ip = await preloadIP();

    if (!isMakeup && !COMPANY_IPS.includes(ip) && !window.allowRemote) {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            html: `<span style="color:#e74c3c; font-weight:bold;">非公司網路且未授權異地打卡！</span>`,
            confirmButtonText: "確定",
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    let lat = "", lng = "";
    if (window.allowRemote && !COMPANY_IPS.includes(ip)) {
        const geo = await getGeoLocation();
        lat = geo.lat;
        lng = geo.lng;
    }

    // 動畫啟動
    const wrapper = document.getElementById("countdownWrapper");
    const circle = document.getElementById("circleProgress");
    const text = document.getElementById("countdownText");

    if (wrapper && circle && text) {
        wrapper.style.display = "flex";
        text.textContent = isMakeup ? "補打卡中..." : "打卡中...";

        const colors = {
            上班: { start: { r:52, g:152, b:219 }, end: { r:41, g:128, b:185 } },
            下班: { start: { r:46, g:204, b:113 }, end: { r:39, g:174, b:96 } },
            補打卡: { start: { r:243, g:156, b:18 }, end: { r:243, g:156, b:18 } }
        };
        const { start: startColor, end: endColor } = isMakeup ? colors.補打卡 : (colors[status] || colors.上班);

        const radius = 50;
        const circumference = 2 * Math.PI * radius;
        circle.style.strokeDasharray = circumference;
        circle.style.strokeDashoffset = circumference;

        let progress = 0;
        function animate() {
            progress = Math.min(progress + 0.007, 1);
            circle.style.strokeDashoffset = circumference * (1 - progress);

            const rC = Math.round(startColor.r*(1-progress) + endColor.r*progress);
            const gC = Math.round(startColor.g*(1-progress) + endColor.g*progress);
            const bC = Math.round(startColor.b*(1-progress) + endColor.b*progress);
            circle.style.stroke = `rgb(${rC},${gC},${bC})`;

            if(progress < 1) {
                requestAnimationFrame(animate);
            } else {
                wrapper.style.transition = "opacity 0.6s";
                wrapper.style.opacity = 0;
                setTimeout(() => {
                    wrapper.style.display = "none";
                    wrapper.style.opacity = 1;
                }, 300);
            }
        }
        requestAnimationFrame(animate);
    }

    // 發送 API
    let apiData = null;
    try {
        const res = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup })
        });
        apiData = await res.json();
    } catch(err) {
        console.error(err);
        apiData = { message:"網路連線異常，請至下方「今日打卡紀錄」確認是否已打卡成功" };
    }

    if (apiData.message && (apiData.message.includes("成功") || apiData.message.includes("更新"))) {
        try {
            sendSelfMessage({
                userName: window.userName,
                status: status,
                date: apiData.date,
                time: apiData.time,
                netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
            });
        } catch (err) {
            console.error("背景傳送訊息失敗", err);
        }

        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
            html: `<div style="font-size: 16px; margin-top: 8px;"><strong>打卡時間：</strong><br><span style="color: #2980b9; font-size: 18px; font-weight: bold;">${apiData.date} ${apiData.time}</span></div>`,
            showConfirmButton: false, 
            timer: 1800, 
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: 'custom-swal-popup' }
        });
    } else {
        Swal.fire({
            icon: "error",
            title: "打卡提示",
            html: `<span style="color: #c0392b;">${apiData?.message || "打卡失敗，請檢查網路！"}</span>`,
            confirmButtonText: "確定",
            customClass: { popup: 'custom-swal-popup' }
        });
    }

    setTimeout(() => {
        updateTodayRecords(false);
    }, 400);
}

function getTodayString() {
    const now = new Date();
    return now.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, "/");
}

/* ===== 共用紀錄渲染函式 ===== */
function renderRecords(data) {
    if (!data || !data.length) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }

    const recordsHTML = data.map(r => {
        let color = r.status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(r.time);
        const networkLabel = COMPANY_IPS.includes(r.ip) ? "公司網路" : "異地打卡";
        const networkColor = COMPANY_IPS.includes(r.ip) ? "#7f8c8d" : "#e67e22";
        const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";
        
        return `
            <div class="record-item" style="border-left-color: ${color};">
              <div class="record-info">
                <div class="record-status">${r.status} ${makeupBadge}</div>
                <div class="record-details" style="color: ${networkColor};">${networkLabel}</div>
              </div>
              <div class="record-time" style="color: ${color};">${time}</div>
            </div>
        `;
    }).join("");

    todayRecords.innerHTML = recordsHTML;
}

/* ===== 今日紀錄非同步更新函式 (支援快取與骨架屏) ===== */
async function updateTodayRecords(isFastRender = false){
  if (!window.userId) return;
  
  if (!isFastRender && !sessionStorage.getItem("cached_today_records")) {
      todayRecords.innerHTML = `
        <div class="record-item" style="border-left-color: #bdc3c7; opacity: 0.6;">
          <div class="record-info">
            <div style="background: #e0e0e0; width: 80px; height: 16px; border-radius: 4px; margin-bottom: 6px;"></div>
            <div style="background: #e0e0e0; width: 60px; height: 12px; border-radius: 4px;"></div>
          </div>
          <div style="background: #e0e0e0; width: 50px; height: 20px; border-radius: 4px;"></div>
        </div>
      `;
  }
  
  try {
    const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${window.userId}&date=${getTodayString()}`);
    const data = await res.json();

    // 儲存至 sessionStorage 快取
    sessionStorage.setItem("cached_today_records", JSON.stringify(data));

    renderRecords(data);
  } catch (err) {
    console.error(err);
    if (!sessionStorage.getItem("cached_today_records")) {
        todayRecords.innerHTML = `<div class="records-empty" style="color: #e74c3c;">今日打卡紀錄讀取失敗</div>`;
    }
  }
}

document.getElementById("btnStart").onclick = () => performClockIn("上班");
document.getElementById("btnEnd").onclick = () => performClockIn("下班");

const btnApprove = document.getElementById("btnApprove");
if (btnApprove) {
    btnApprove.onclick = () => {
        window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
    };
}
</script> 
</body>
</html>
