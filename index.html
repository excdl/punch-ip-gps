<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能打卡系統</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      width: 95%;
      max-width: 480px;
      border-radius: 20px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    #userInfo { font-size: 28px; font-weight: bold; text-align: center; color: #2c3e50; }
    #dateTime { font-size: 22px; color: #7f8c8d; text-align: center; }
    #statusInfo {
      font-size: 20px;
      color: white;
      padding: 8px 25px;
      border-radius: 25px;
      text-align: center;
      min-width: 180px;
      background: #95a5a6;
    }
    .buttons-container { display: flex; gap: 15px; width: 100%; }
    .buttons-container button {
      flex: 1;
      padding: 15px 0;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: white;
      transition: all 0.2s;
    }
    #btnStart { background: linear-gradient(135deg, #ff9f43, #ee5253); }
    #btnEnd { background: linear-gradient(135deg, #3498db, #2980b9); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 今日紀錄 */
    #todayRecordsContainer {
      width: 100%;
      background: #fafbfc;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e1e8ed;
    }
    .records-title {
      font-size: 16px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .record-item {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #3498db;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .record-item:last-child { margin-bottom: 0; }
    .record-info { display: flex; flex-direction: column; gap: 2px; }
    .record-status { font-size: 16px; font-weight: bold; color: #2c3e50; }
    .record-details { font-size: 13px; color: #7f8c8d; }
    .record-time { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .badge-makeup {
      background: #e67e22;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
    }
    .records-empty { text-align: center; color: #95a5a6; font-size: 15px; padding: 15px 0; }

    /* 簽核 */
    #btnApprove {
      margin-top: 10px;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      background: linear-gradient(145deg, #8e44ad, #663399);
      color: white;
      display: none;
      width: 100%;
      cursor: pointer;
      border: none;
    }

    /* SweetAlert */
    .swal2-popup.custom-swal-popup {
      border-radius: 20px !important;
      padding: 24px !important;
      font-family: Arial, "Noto Sans TC", sans-serif !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
    }
    .swal2-title { font-size: 22px !important; color: #2c3e50 !important; font-weight: bold !important; }
    .swal2-html-container { font-size: 16px !important; color: #555 !important; }
    .swal2-styled.swal2-confirm {
      background: linear-gradient(135deg, #3498db, #2980b9) !important;
      border-radius: 10px !important;
      font-size: 16px !important;
      font-weight: bold !important;
      padding: 10px 24px !important;
    }

    /* Loading (第一組 SVG 圓形環) */
    #countdownWrapper {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255,255,255,0.92);
      z-index: 999999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }
    #circleProgress {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.12s linear;
    }
    #countdownText { margin-top: 15px; font-size: 17px; font-weight: bold; color: #2c3e50; text-align: center; }
    .loading-sub { margin-top: 8px; font-size: 13px; color: #7f8c8d; }
  </style>
</head>
<body>
  <div class="card">
    <div id="userInfo">載入使用者資訊中...</div>
    <div id="statusInfo">網路與定位初始化中…</div>
    <div id="dateTime">載入中…</div>
    <div class="buttons-container">
      <button id="btnStart" disabled>同步中…</button>
      <button id="btnEnd" disabled>同步中…</button>
    </div>

    <!-- Loading -->
    <div id="countdownWrapper">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" stroke="#eeeeee" stroke-width="12" fill="none"></circle>
        <circle id="circleProgress" cx="60" cy="60" r="50" stroke="#3498db" stroke-width="12" fill="none" transform="rotate(-90 60 60)"></circle>
      </svg>
      <div id="countdownText">打卡中...</div>
      <div class="loading-sub">請勿關閉此頁面</div>
    </div>

    <!-- 今日紀錄 -->
    <div id="todayRecordsContainer">
      <div class="records-title">📋 今日打卡紀錄</div>
      <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>

    <button id="btnApprove">查看｜簽核</button>
  </div>

  <script>
    /* =========================================================
       基本設定 (使用第二組的 API 與設定)
    ========================================================= */
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzAmC7jMjmNohujhhdZhoHVo71gd9X95aqq469G9_JVbSSTpnaw4zd8IdUaD38AWwJX4g/exec";
    const COMPANY_IPS  = ["220.134.112.245", "114.34.60.48"];
    const MANAGERS = ["U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"];
    const LIFF_ID = "2008520938-4018BD8v";

    const userInfo = document.getElementById("userInfo");
    const statusInfo = document.getElementById("statusInfo");
    const dateTime = document.getElementById("dateTime");
    const btnStart = document.getElementById("btnStart");
    const btnEnd = document.getElementById("btnEnd");
    const todayRecords = document.getElementById("todayRecords");
    const btnApprove = document.getElementById("btnApprove");
    const loadingWrapper = document.getElementById("countdownWrapper");
    const loadingCircle = document.getElementById("circleProgress");
    const loadingText = document.getElementById("countdownText");

    window.userId = "";
    window.userName = "";
    window.allowRemote = false;
    window.userReady = false;
    let isClocking = false;

    function updateDateTime() {
      dateTime.textContent = new Date().toLocaleString("zh-TW", { hour12: false });
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    function setButtonsLock(locked, startText = "上班", endText = "下班") {
      btnStart.disabled = locked || isClocking;
      btnEnd.disabled = locked || isClocking;
      btnStart.textContent = startText;
      btnEnd.textContent = endText;
      window.userReady = !locked && !!window.userId;
    }

    async function fetchWithTimeout(url, options = {}, timeout = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        return response;
      } finally {
        clearTimeout(timer);
      }
    }

    async function preloadIP(forceRefresh = false) {
      const cache = sessionStorage.getItem("myIP");
      if (cache && !forceRefresh) return cache;
      try {
        const response = await fetchWithTimeout("https://api.ipify.org?format=json", {}, 2000);
        if (!response.ok) return cache || "";
        const data = await response.json();
        const ip = String(data.ip || "").trim();
        if (ip) sessionStorage.setItem("myIP", ip);
        return ip || cache || "";
      } catch (error) {
        return cache || "";
      }
    }

    function loadUserFromCache() {
      const cachedUserId = localStorage.getItem("cached_userId");
      const cachedUserName = localStorage.getItem("cached_userName");
      if (cachedUserId) {
        window.userId = cachedUserId;
        window.userName = cachedUserName || "使用者";
        userInfo.textContent = `${window.userName} 您好`;
        if (MANAGERS.includes(window.userId)) {
          btnApprove.style.display = "block";
        }
      }
      const cachedRecords = sessionStorage.getItem("cached_today_records");
      if (cachedRecords) {
        try { renderRecords(JSON.parse(cachedRecords)); } catch (error) {}
      }
    }

    async function initUser() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const profile = await liff.getProfile();
      window.userId = String(profile.userId || "").trim();
      window.userName = profile.displayName || "使用者";
      userInfo.textContent = `${window.userName} 您好`;
      localStorage.setItem("cached_userId", window.userId);
      localStorage.setItem("cached_userName", window.userName);
      if (MANAGERS.includes(window.userId)) {
        btnApprove.style.display = "block";
      } else {
        btnApprove.style.display = "none";
      }
    }

    function isCompanyIP(ip) {
      return COMPANY_IPS.includes(String(ip || "").trim());
    }

    async function updateStatus() {
      if (!window.userId) return;
      const ip = await preloadIP();
      const isCompany = isCompanyIP(ip);
      if (isCompany) {
        statusInfo.textContent = "有效打卡區";
        statusInfo.style.background = "#2ecc71";
        window.allowRemote = false;
        setButtonsLock(false, "上班", "下班");
        return;
      }
      try {
        const url = `${API_ENDPOINT}?action=checkRemote&userId=${encodeURIComponent(window.userId)}`;
        const response = await fetchWithTimeout(url, {}, 5000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const remoteData = await response.json();
        const remoteAllowed = remoteData.allowed === true;
        window.allowRemote = remoteAllowed;
        if (remoteAllowed) {
          statusInfo.textContent = "有效打卡區（異地）";
          statusInfo.style.background = "#2ecc71";
          setButtonsLock(false, "上班", "下班");
        } else {
          statusInfo.textContent = "無效打卡區";
          statusInfo.style.background = "#e74c3c";
          setButtonsLock(true, "上班", "下班");
        }
      } catch (error) {
        window.allowRemote = false;
        statusInfo.textContent = "網路檢查失敗";
        statusInfo.style.background = "#e67e22";
        setButtonsLock(true, "上班", "下班");
      }
    }

    function getGeoLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) { resolve({ lat: "", lng: "" }); return; }
        navigator.geolocation.getCurrentPosition(
          position => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
          () => resolve({ lat: "", lng: "" }),
          { timeout: 3000, enableHighAccuracy: false, maximumAge: 60000 }
        );
      });
    }

    function startLoading(status) {
      loadingWrapper.style.display = "flex";
      loadingWrapper.style.opacity = "1";
      loadingText.textContent = status === "上班" ? "上班打卡中..." : "下班打卡中...";
      const radius = 50;
      const circumference = 2 * Math.PI * radius;
      loadingCircle.style.strokeDasharray = circumference;
      loadingCircle.style.strokeDashoffset = circumference;
      loadingCircle.style.stroke = status === "下班" ? "#2ecc71" : "#3498db";
      return { circumference };
    }

    function updateLoading(progress, circumference) {
      const safeProgress = Math.max(0, Math.min(1, progress));
      loadingCircle.style.strokeDashoffset = circumference * (1 - safeProgress);
    }

    function stopLoading() {
      loadingWrapper.style.opacity = "0";
      setTimeout(() => { loadingWrapper.style.display = "none"; loadingWrapper.style.opacity = "1"; }, 180);
    }

    function fixTimeFormat(value) {
      if (!value) return "00:00:00";
      if (typeof value === "string" && value.includes(":") && !value.includes("T")) {
        const parts = value.split(":");
        while (parts.length < 3) parts.push("00");
        return parts.slice(0, 3).map(v => String(v).padStart(2, "0")).join(":");
      }
      if (typeof value === "string" && value.includes("T")) {
        const d = new Date(value);
        if (!isNaN(d)) return d.toLocaleTimeString("zh-TW", { hour12: false });
      }
      return String(value);
    }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    }

    function renderRecords(data) {
      if (!Array.isArray(data) || data.length === 0) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
      }
      todayRecords.innerHTML = data.map(record => {
        const status = record.status === "下班" ? "下班" : "上班";
        const color = status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(record.time);
        const ip = String(record.ip || "");
        const networkLabel = isCompanyIP(ip) ? "公司網路" : "異地打卡";
        const networkColor = isCompanyIP(ip) ? "#7f8c8d" : "#e67e22";
        const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

        return `
          <div class="record-item" style="border-left-color:${color};">
            <div class="record-info">
              <div class="record-status">${status} ${makeupBadge}</div>
              <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
            </div>
            <div class="record-time" style="color:${color};">${time}</div>
          </div>
        `;
      }).join("");
    }

    async function updateTodayRecords() {
      if (!window.userId) return;
      try {
        const date = getTodayString();
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(date)}`;
        const response = await fetchWithTimeout(url, {}, 6000);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        sessionStorage.setItem("cached_today_records", JSON.stringify(data));
        renderRecords(data);
      } catch (error) {
        const cache = sessionStorage.getItem("cached_today_records");
        if (!cache) {
          todayRecords.innerHTML = `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄讀取失敗</div>`;
        }
      }
    }

    async function sendSelfMessage(record) {
      try {
        if (!window.liff || !liff.isInClient()) return;
        const headerColor = record.status === "下班" ? "#2ecc71" : "#3498db";
        await liff.sendMessages([{
          type: "flex",
          altText: `【打卡通知】${record.status}成功`,
          contents: {
            type: "bubble",
            header: {
              type: "box", layout: "vertical",
              contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
              backgroundColor: headerColor, paddingAll: "12px"
            },
            body: {
              type: "box", layout: "vertical", spacing: "md",
              contents: [
                { type: "text", text: `狀態：${record.status}`, size: "md" },
                { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                { type: "text", text: `網路：${record.netType}`, size: "md" }
              ]
            }
          }
        }]);
      } catch (error) {}
    }

    async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
      if (isClocking) return;
      if (!window.userReady && !isMakeup) {
        Swal.fire({ icon: "warning", title: "提示", text: "目前為無效打卡區，無法打卡！", confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" } });
        return;
      }
      if (!window.userId) {
        Swal.fire({ icon: "warning", title: "提示", text: "尚未取得 LINE 使用者資訊，請稍候再試。", confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" } });
        return;
      }

      isClocking = true;
      setButtonsLock(true, "打卡中...", "打卡中...");

      const loading = startLoading(status);
      let loadingProgress = 0;
      const loadingTimer = setInterval(() => {
        loadingProgress = Math.min(loadingProgress + 0.03, 0.9);
        updateLoading(loadingProgress, loading.circumference);
      }, 100);

      try {
        const ip = sessionStorage.getItem("myIP") || "";
        let lat = "", lng = "";
        if (!isMakeup && !isCompanyIP(ip) && window.allowRemote) {
          const geo = await getGeoLocation();
          lat = geo.lat;
          lng = geo.lng;
        }

        const payload = { userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup };
        const response = await fetchWithTimeout(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }, 10000);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const responseText = await response.text();
        if (!responseText) throw new Error("伺服器沒有回傳資料");

        let apiData = JSON.parse(responseText);
        if (!apiData || apiData.success !== true && !String(apiData?.message || "").includes("成功")) {
          throw new Error(apiData?.message || "打卡失敗，請稍後再試");
        }

        updateLoading(1, loading.circumference);
        clearInterval(loadingTimer);
        stopLoading();

        Swal.fire({
          icon: "success",
          title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
          html: `<div style="font-size:16px;margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9;font-size:18px;font-weight:bold;">${apiData.date || ""} ${apiData.time || ""}</span></div>`,
          showConfirmButton: false,
          timer: 1800,
          timerProgressBar: true,
          backdrop: "rgba(0,0,0,0.5)",
          customClass: { popup: "custom-swal-popup" }
        });

        sendSelfMessage({
          userName: window.userName, status, date: apiData.date, time: apiData.time,
          netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
        }).catch(() => {});

        setTimeout(() => { updateTodayRecords(); }, 300);

      } catch (error) {
        clearInterval(loadingTimer);
        stopLoading();
        Swal.fire({
          icon: "error",
          title: "打卡失敗",
          html: `<div style="color:#c0392b;font-weight:bold;line-height:1.7;">${escapeHtml(error.message || "網路連線異常")}</div>`,
          confirmButtonText: "確定",
          customClass: { popup: "custom-swal-popup" }
        });
      } finally {
        clearInterval(loadingTimer);
        isClocking = false;
        await updateStatus();
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    btnStart.onclick = () => { performClockIn("上班"); };
    btnEnd.onclick = () => { performClockIn("下班"); };
    btnApprove.onclick = () => {
      window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
    };

    window.addEventListener("load", async () => {
      statusInfo.textContent = "系統初始化中...";
      statusInfo.style.background = "#95a5a6";
      setButtonsLock(true, "同步中...", "同步中...");

      loadUserFromCache();

      try {
        await Promise.all([initUser(), preloadIP()]);
        if (!window.userId) {
          statusInfo.textContent = "請完成 LINE 登入";
          statusInfo.style.background = "#95a5a6";
          return;
        }
        await Promise.all([updateStatus(), updateTodayRecords()]);
      } catch (error) {
        statusInfo.textContent = "初始化失敗，請重新整理";
        statusInfo.style.background = "#e74c3c";
        setButtonsLock(true, "重新整理", "重新整理");
      }
    });
  </script>
</body>
</html>
